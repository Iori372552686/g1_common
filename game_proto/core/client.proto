syntax = "proto3";

package g1.protocol;
option go_package = "github.com/Iori372552686/g1_common/protocol;g1_protocol";

import "core/common.proto";
import "core/role.proto";
import "service/infosvr.proto";

// ---- chat / mail / friend / GM (formerly separate *.proto) ----

message PbChatMsg {
    int32      channel     = 1;
    uint64     sender      = 2;
    PbIconDesc sender_icon = 3;
    uint64     receiver    = 4;
    string     msg         = 10;
}

message PbChatFriendMsg {
    uint64             friend_uid = 1;
    repeated PbChatMsg msg_list   = 2;
}

message PbChatInfo {
    uint64                   uid             = 1;
    repeated PbChatFriendMsg friend_msg_list = 2;
}

message PbMail {
    int32            id               = 1;
    int32            type             = 2;
    int32            conf_id          = 3;
    int32            create_time      = 4;
    repeated PbItem  attach_list      = 5;
    uint64           sender           = 6;
    bool             read             = 10;
    bool             attach_get       = 11;
    string           title            = 20;
    string           content          = 21;
    repeated string  content_argv     = 22;
    int32            remove_start_time = 50;
}

message MailInfo {
    uint64           uid            = 1;
    repeated PbMail  mail_list    = 2;
    int32            cur_mail_id  = 3;
    repeated int32   add_mail_list = 4;
}

message MailInnerAddMailReq {
    repeated PbMail mail_list = 1;
}

message MailInnerAddMailRsp {
    Ret ret = 1;
}

message PbFriend {
    uint64 uid = 1;
}

message PbFriendInvitation {
    uint64 uid         = 1;
    int32  invite_time = 2;
}

message RoleFriendInfo {
    uint64                   uid              = 1;
    repeated PbFriend         friend_list     = 2;
    repeated uint64           black_list      = 3;
    repeated PbFriendInvitation invitation_list = 4;
}

message FriendInnerAddFriendReq {
    uint64 from_uid       = 1;
    bool   is_del_friend  = 2;
}

message FriendInnerAddFriendRsp {
    Ret ret = 1;
}

message FriendInnerConfirmFriendReq {
    uint64 from_uid   = 1;
    string from_name  = 2;
    bool   is_reject  = 3;
}

message FriendInnerConfirmFriendRsp {
    Ret ret = 1;
}

message GMGetRoleReq {}

message GMGetRoleRsp {
    Ret      ret       = 1;
    RoleInfo role_info = 2;
}

message GMSetRoleReq {
    RoleInfo role_info = 1;
}

message GMSetRoleRsp {
    Ret ret = 1;
}

message GMAddItemReq {
    int32 id    = 1;
    int64 count = 2;
}

message GMAddItemRsp {
    Ret ret = 1;
}

// SC_KICK_OUT
message ScKickOut {
    EKickOutReason reason = 1;
}

// connsvr internal ssrpc (e.g. mainsvr -> connsvr); not pushed as SC_KICK_OUT.
message ConnKickOutReq {
    EKickOutReason reason      = 1;
    string         remote_addr = 2;
}

message ConnKickOutRsp {
    Ret ret = 1;
}

message ConnBroadcastReq {
    uint32 cmd  = 1;
    bytes  body = 2;
}

message ConnBroadcastRsp {}

// SC_SYNC_USER_DATA
message ScSyncUserData {
    RoleInfo role_info = 1;
}

// Patch payloads for SC_SYNC_USER_DATA_V2 (inventory / mall / icon / activity task).
message RoleInventoryPatch {
    repeated PbItem upsert_items     = 1;
    repeated int32  delete_item_ids    = 2;
}

message RoleMallPatch {
    repeated PbMallItem upsert_items = 1;
    repeated int32      delete_conf_ids = 2;
}

message RoleIconPatch {
    bool              has_current_icon_url = 1;
    string            current_icon_url    = 2;
    bool              has_current_frame_id  = 3;
    int32             current_frame_id    = 4;
    repeated PbIcon   upsert_icons          = 5;
    repeated int32    delete_icon_ids       = 6;
    repeated PbFrame  upsert_frames         = 7;
    repeated int32    delete_frame_ids      = 8;
}

message RoleActvityTaskPatch {
    repeated PbTask upsert_tasks    = 1;
    repeated int32  delete_task_ids = 2;
}

// 货币增量：value 为变更币种的最新余额（货币无删除语义）。
message RoleCurrencyPatch {
    map<int32, int64> changed = 1;
}

// SC_SYNC_USER_DATA_V2: full_section_mask 携带完整 RoleInfo 子集；patch_* 为对应板块的增量。
message ScSyncUserDataV2 {
    int32                  full_section_mask  = 1;
    int32                  patch_section_mask = 2;
    RoleInfo               role_info          = 3;
    RoleInventoryPatch     inventory_patch    = 4;
    RoleMallPatch          mall_patch         = 5;
    RoleIconPatch          icon_patch         = 6;
    RoleActvityTaskPatch   actvity_task_patch = 7;
    RoleCurrencyPatch      currency_patch     = 8;
}

// SC_CHAT
message ScChat {
    PbChatMsg msg = 1;
}

// SC_DATA_CHANGE_NOTIFY
message ScDataChangeNotify {
    int32 cmd = 1;
    //    bool friend = 1;     // 好友系统更新
    //    bool mail = 2;   // 邮件系统更新
}


// MAIN_LOGIN_REQ
message LoginReq {
    string account    = 1;
    string token      = 2;
    uint32 channel_id = 3; //不同渠道包，channel id不同
    string login_type = 4; //登录类型 , 字符串表示： 游客登录 邮箱登录 第三方渠道名
    string device_os  = 5;
}

message LoginRsp {
    Ret      ret         = 1;
    int64    time_now_ms = 2;
    RoleInfo role_info   = 3;
}

// MAIN_LOGOUT_REQ
message LogoutReq {
    bool   by_server = 1;
    string reason    = 2;
}

message LogoutRsp {
    Ret ret = 1;
}

// MAIN_HEARTBEAT_REQ
message HeartBeatReq {
    int64 client_now_ms = 2;
}

message HeartBeatRsp {
    Ret   ret                  = 1;
    int64 client_now_ms_in_req = 2;
    int64 server_now_ms        = 3;
}

// MAIN_ITEM_USE_REQ
message ItemUseReq {
    repeated PbItem item_list = 1;
}

message ItemUseRsp {
    Ret             ret                = 1;
    repeated PbItem real_add_item_list = 2; // 实际加到玩家身上的东西，比如说开宝箱后的东西
}

// MAIN_CHANGE_NAME_REQ
message ChangeNameReq {
    string name = 1;
}

message ChangeNameRsp {
    Ret ret = 1;
}

// MAIN_CHANGE_ICON_REQ
message ChangeIconReq {
    int32 icon_id  = 1; // 头像
    int32 frame_id = 2; // 相框
    int32 image_id = 3; // 立绘
}

message ChangeIconRsp {
    Ret ret = 1;
}

// INFO_GET_BRIEF_INFO_REQ
message InfoGetBriefInfoReq {
    repeated uint64 uid_list = 1;
}

message InfoGetBriefInfoRsp {
    Ret                      ret       = 1;
    repeated PbRoleBriefInfo info_list = 2;
}

// INFO_GET_ICON_DESC_REQ
message InfoGetIconDescReq {
    repeated uint64 uid_list = 1;
}

message InfoGetIconDescRsp {
    Ret                 ret       = 1;
    repeated PbIconDesc icon_list = 2;
}

// GUIDE_COMPLETED_REQ
message GuideCompletedReq {
    int32 id = 1; //发送已经完成引导ID
}

message GuideCompletedRsp {
    Ret ret = 1;
}

// GUIDE_IN_PROGRESS_REQ
message GuideInProgressReq {
    int32 id = 1; // 发送正在进行的引导ID
}

message GuideInProgressRsp {
    Ret ret = 1;
}

// EXCHANGE_GIFT_BAG_REQ
message ExchangeGiftBagReq {
    string code = 1;
}

message ExchangeGiftBagRsp {
    Ret             ret       = 1;
    repeated PbItem item_list = 2;
}

// MAIL_GET_MAIL_LIST_REQ
message GetMailListReq {}

message GetMailListRsp {
    Ret      ret       = 1;
    MailInfo mail_info = 2;
}

// MAIL_READ_MAIL_REQ
message ReadMailReq {
    repeated int32 id_list = 1;
}

message ReadMailRsp {
    Ret            ret     = 1;
    repeated int32 id_list = 2;
}

// MAIL_DEL_MAIL_REQ
message DelMailReq {
    repeated int32 id_list = 1;
}

message DelMailRsp {
    Ret            ret     = 1;
    repeated int32 id_list = 2;
}

// MAIL_GET_MAIL_ATTACH_REQ
message GetMailAttachReq {
    repeated int32 id_list = 1;
}

message GetMailAttachRsp {
    Ret             ret       = 1;
    repeated int32  id_list   = 2;
    repeated PbItem item_list = 3;
}

// CHAT_CHAT_REQ
message ChatChatReq {
    PbChatMsg msg = 1;
}

message ChatChatRsp {
    Ret ret = 1;
}

// CHAT_GET_CHAT_INFO_REQ
message ChatGetChatInfoReq {}

message ChatGetChatInfoRsp {
    Ret        ret       = 1;
    PbChatInfo chat_info = 2;
}

// CHAT_DEL_CHAT_REQ
message ChatDelChatReq {
    uint64 friend_uid = 1;
}

message ChatDelChatRsp {
    Ret ret = 1;
}

// FRIEND_GET_FRIEND_INFO_REQ
message FriendGetFriendInfoReq {}

message FriendGetFriendInfoRsp {
    Ret            ret         = 1;
    RoleFriendInfo friend_info = 2;
}

// FRIEND_ADD_FRIEND_REQ
message FriendAddFriendReq {
    uint64 friend_uid    = 1;
    bool   is_del_friend = 2;
}

message FriendAddFriendRsp {
    Ret    ret           = 1;
    uint64 friend_uid    = 2;
    bool   is_del_friend = 3;
}

// FRIEND_CONFIRM_FRIEND_REQ
message FriendConfirmFriendReq {
    uint64 friend_uid     = 1;
    bool   is_reject      = 2;
    bool   all_invitation = 3; // 是否针对所有请求
}

message FriendConfirmFriendRsp {
    Ret    ret            = 1;
    uint64 friend_uid     = 2;
    bool   is_reject      = 3;
    bool   all_invitation = 4; // 是否针对所有请求
}

// FRIEND_SHIELD_USER_REQ
message FriendShieldUserReq {
    uint64 shield_uid       = 1;
    bool   is_cancel_shield = 2;
}

message FriendShieldUserRsp {
    Ret    ret              = 1;
    uint64 shield_uid       = 2;
    bool   is_cancel_shield = 3;
}

// FRIEND_SEARCH_ROLE_REQ
message FriendSearchRoleReq {
    string search_string = 1;
}

message FriendSearchRoleRsp {
    Ret                 ret       = 1;
    repeated PbIconDesc role_list = 2;
}


// MAIN_MALL_BUY_PACKAGE_REQ
message MallBuyPackageReq {
    int32 conf_id = 1;
}

message MallBuyPackageRsp {
    Ret ret = 1;
}

// MAIN_MALL_RECHARGE_REQ
message MallRechargeReq {
    int32 conf_id = 1;
    int32 channel = 2;
}

message MallRechargeRsp {
    Ret ret = 1;
}

// ============================================================
// 背包/道具系统业务协议
// ============================================================

// 使用道具
message UseItemReq {
    int32 item_id = 1;
    int32 count   = 2;
}
message UseItemRsp {
    Ret ret = 1;
}

// 出售道具
message SellItemReq {
    int32 item_id = 1;
    int32 count   = 2;
}
message SellItemRsp {
    Ret ret = 1;
}

// 分解道具
message DecomposeItemReq {
    int32 item_id = 1;
    int32 count   = 2;
}
message DecomposeItemRsp {
    Ret   ret     = 1;
    repeated PbItem rewards = 2; // 分解产出
}

// 背包查询（分类分页）
message QueryBackpackReq {
    int32 bag_type  = 1; // 分类标签(对应 ItemConfig.BagType，0=全部)
    int32 page_idx  = 2; // 页码，从1开始
    int32 page_size = 3; // 每页数量，0=默认30，上限100
}
message QueryBackpackRsp {
    Ret                 ret       = 1;
    int32               total     = 2; // 命中总数
    int32               page_idx  = 3;
    int32               page_size = 4;
    int32               bag_type  = 5;
    repeated PbItem     items     = 6; // 当前页道具
}

// 批量添加道具（GM/测试用）
message BatchAddItemReq {
    repeated PbItem items = 1;
}
message BatchAddItemRsp {
    Ret ret = 1;
}

// ============================================================
// 恭喜获得系统
// 资产状态仍以背包/货币同步协议为准；本协议仅做奖励展示聚合推送。
// ============================================================

// ObtainDisplayMode 展示模式
enum ObtainDisplayMode {
    OBTAIN_DISPLAY_NONE  = 0; // 不展示
    OBTAIN_DISPLAY_TIPS  = 1; // 轻提示
    OBTAIN_DISPLAY_POPUP = 2; // 弹窗
    OBTAIN_DISPLAY_SETTLE = 3; // 结算面板
}

// ObtainRewardItem 获得展示条目
message ObtainRewardItem {
    int32             reward_type = 1; // 1=道具, 2=货币
    int32             item_id     = 2;
    int64             count       = 3;
    int32             quality     = 5;
    string            name        = 6;
    string            icon        = 7;
    bool              rare        = 8;  // 稀有(触发升级为弹窗)
}

// S2CObtainNotice 获得奖励展示推送（服务端主动推送，走 CMD_SC_OBTAIN_NOTICE）
message S2CObtainNotice {
    string                   request_id      = 1;
    string                   source          = 2; // 来源标识(对应 ObtainPolicyConfig.Source)
    int32                    source_ref_id   = 3;
    ObtainDisplayMode        display_mode    = 4;
    repeated ObtainRewardItem items          = 5;
    bool                     has_more        = 6; // 超过 max_show_count 截断
    int32                    total_item_count = 7;
    int64                    server_time     = 8;
}