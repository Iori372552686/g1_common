syntax = "proto3";

package g1.protocol;
option go_package = "github.com/Iori372552686/g1_common/protocol;g1_protocol";


// 角色信息
message MysqlRoleInfo {
    uint64 uid  = 1; // @inject_tag: gorm:"column:uid;type:bigint;primaryKey;comment:玩家uid"
    string name = 2; // @inject_tag: gorm:"column:name;type:varchar(25);index:IDX_role_info_name;comment:玩家名称"
}

// 角色全量数据快照（L3 持久层）：data 为 RoleInfo 整包 proto 序列化。
// update_time 用服务器时钟（datetime.NowMs），禁用带时区偏移的 Role.Now()，
// 与 SaveRoom/SaveGame 同构，作陈旧写守卫（repository.ErrStaleUpdate）。
message MysqlRoleData {
    uint64 uid         = 1; // @inject_tag: gorm:"column:uid;type:bigint;primaryKey;comment:玩家uid"
    bytes  data        = 2; // @inject_tag: gorm:"column:data;type:longblob;comment:RoleInfo整包序列化"
    int64  update_time = 3; // @inject_tag: gorm:"column:update_time;type:bigint;comment:更新时间(服务器时钟ms)"
}

