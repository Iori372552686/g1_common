syntax = "proto3";

package g1.protocol;
option go_package = "github.com/Iori372552686/g1_common/protocol;g1_protocol";

// 旧德州项目的扑克玩法枚举（CardType/GameState/BettingRound/OperateType/
// GameNotifyType/DealType/DataType 等）已于 2026-09-27 移除；
// 以下仅保留与具体玩法无关的通用原语。

// 花色定义（通用卡牌原语）
enum Color {
    COLOR_NONE    = 0x00; // 无花色
    COLOR_DIAMOND = 0x01; // 1
    COLOR_CLUB    = 0x02; // 2
    COLOR_HEART   = 0x04; // 4
    COLOR_SPADE   = 0x08; // 8
}

// uint32( COLOR<<16 | RANK )

// 点数（通用卡牌原语）
enum Rank {
    Rank_0  = 0; // 无点数
    RANK_1  = 1; // A座位1的时候
    RANK_2  = 2;
    RANK_3  = 3;
    RANK_4  = 4;
    RANK_5  = 5;
    RANK_6  = 6;
    RANK_7  = 7;
    RANK_8  = 8;
    RANK_9  = 9;
    RANK_10 = 10;
    RANK_J  = 11;
    RANK_Q  = 12;
    RANK_K  = 13;
    RANK_A  = 14;
}

enum GameTypeId {
    GAME_TYPE_NONE  = 0;  // 无效玩法
    //rummy
    RUMMY_MODE_START = 20; // RUMMY玩法开始
    RUMMY_NORMAL     = 21; // RUMMY常规玩法
}

enum CoinType {
    COIN_NONE  = 0; // 无效币种
    COIN_GOLD  = 1; // 金币
    COIN_ACE   = 2; // Ace coin
    COIN_SCORE = 3; // 积分
}

enum RoomStage {
    Free   = 0; // 免费模式，体验模式
    LOW    = 1; // 初级
    MIDDLE = 2; // 中级
    HIGH   = 3; // 高级

    Stage_ALL = 99; // 全部类型
}

enum RoomState {
    WAITSTART = 0; // 等待开始
    PLAYING   = 1; // 比赛中
    END       = 2; // 已结束
    PAUSE     = 3; //房间状态暂停
}

enum RoomSortType {
    SORT_TYPE_NONE   = 0; // 默认值
    SORT_TYPE_ID     = 1; // ID排序
    SORT_TYPE_PLAYER = 2; // 玩家人数排序
    SORT_TYPE_TIME   = 3; // 时间排序
}
