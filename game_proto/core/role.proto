syntax = "proto3";

package g1.protocol;
option go_package = "github.com/Iori372552686/g1_common/protocol;g1_protocol";

message RoleRegisterInfo {
    uint64 uid                = 1;
    int32  register_time      = 2;
    int32  zone               = 3;
    int32  time_offset_minute = 4;
}

message RoleLoginInfo {
    int32 last_login_time     = 1;
    int32 last_logout_time    = 2;
    int32 last_hart_beat_time = 3;
    int32 now_login_time      = 4;
}

message RoleGameInfo {
    repeated uint64 play_room_ids = 1; // 正在游玩的房间IDs
}

message RoleBasicInfo {
    string name         = 1;  // 角色名称
    int32  level        = 2;  // 等级
    // 以下货币/资源字段已废弃（迁移至 RoleCurrencyInfo.currency_map，按 EItemID
    // 货币段 key 存储）。字段号保留占位防止复用；服务端已停写停读。
    int64  exp          = 3;  // [deprecated] 经验 → currency_map[EItemID.EXP]
    int64  gold         = 4;  // [deprecated] 金币 → currency_map[EItemID.GOLD]
    int64  diamond      = 5;  // [deprecated] 钻石 → currency_map[EItemID.DIAMOND]
    int64  credit       = 6;  // [deprecated] 信用 → currency_map[EItemID.CREDIT]
    int64  liveness     = 7;  // [deprecated] 活跃度 → currency_map[EItemID.LIVENESS]
    int64  guild_coin   = 8;  // [deprecated] 公会币 → currency_map[EItemID.GUILD_COIN]
    uint32 free_cnt     = 9;  // 免费改名次数
    int64  ace_coin     = 10; // [deprecated] ace币 → currency_map[EItemID.ACECOIN]
    int64  win_ace_coin = 11; // [deprecated] Win ace币 → currency_map[EItemID.WIN_ACECOIN]
}

// 道具信息
message PbItem {
    int32 id    = 1;
    int64 count = 2;
    int32 time  = 3; // 0表示永久
}

message RoleInventoryInfo {
    map<int32, PbItem> item_map = 1;
}

// 头像
message PbIcon {
    int32 id        = 1;
    bool  red_point = 2;
}

// 头像框
message PbFrame {
    int32 id        = 1;
    bool  red_point = 2;
}

// 头像
message RoleIconInfo {
    string              icon_url  = 1; // 当前头像url
    int32               frame_id  = 2; // 当前相框
    map<int32, PbIcon>  icon_map  = 3; // 已解锁的头像列表
    map<int32, PbFrame> frame_map = 4; // 已解锁的头像框列表
}

// 商城礼包
message PbMallItem {
    int32 conf_id         = 1;
    int32 daily_buy_count = 2;
    int32 total_buy_count = 3;
}

// 商城礼包
message RoleMallInfo {
    map<int32, PbMallItem> item_map = 1;
}

message PbTask {
    int32 task_id   = 1;
    int32 argv1     = 2;
    int32 argv2     = 3;
    int32 argv3     = 4;
    int32 progress  = 5;
    int32 task_type = 6;
    int32 has_award = 7; //完成奖励   0未领取 1可领取，2自动发放，3手动领取
}

message RoleTaskInfo {
    map<int32, PbTask> task_map = 1;
}

// 主线任务
message RoleMainTaskInfo {
    int32 cur_task_id = 1;
    bool  finished    = 2;
}

// 个人公会信息 ,例如公会副本，商场购买记录等
message RoleGuildInfo {
    uint64 gid        = 1;
    string name       = 2;
    int32  title      = 3;
    uint32 donate_cnt = 4;
}

//玩家引导ID
message RoleGuideInfo {
    repeated int32 id_lis = 1; // 已经完成
    int32          cur_id = 2; // 正在进行的ID
}

// 功能开放列表
message RoleOpenFunction {
    repeated int32 data        = 1; // 已经开放的功能ID
    bool           is_all_open = 2; // 测试用,上线后删除该字段
}

// 礼包码
message RoleGiftExchangeInfo {
    map<int32, int32> type_map = 1; // 已经领取过的礼包  key:类型id,val: 数量
}

//活动任务,日常，成就等
message RoleActvityTaskInfo {
    map<int32, PbTask> task_map = 1;
}

// 角色的所有数据
message RoleInfo {
    RoleRegisterInfo     register_info  = 1;
    RoleLoginInfo        login_info     = 2;
    RoleGameInfo         game_info      = 3;   // 游戏信息
    RoleBasicInfo        basic_info     = 4;   // role base
    RoleInventoryInfo    inventory_info = 5;   // 背包数据
    RoleIconInfo         icon_info      = 6;   // 头像资源
    RoleMallInfo         mall_info      = 7;   // 商城
    RoleMainTaskInfo     main_task_info = 8;   // 主线任务
    RoleGuildInfo        guild_info     = 9;   // 公会
    RoleGuideInfo        guide_info     = 10;  // 引导数据
    RoleOpenFunction     open_fun_info  = 11;  // 功能开放
    RoleGiftExchangeInfo gift_info      = 12;  // 礼包兑换
    RoleActvityTaskInfo  actvity_Info   = 13;  // 活动任务，日常等
    RoleCurrencyInfo     currency_info  = 14;  // 货币/资源（1-9999 段）
    ConnSvrInfo          conn_svr_info  = 100; // 服务器用，客户端不用管
}

// 货币/资源余额。key 为货币 ID（EItemID 货币段，1-9999）；
// 全部资源（金币/钻石/体力/经验等）集中于此，加新货币零 proto 改动。
message RoleCurrencyInfo {
    map<int32, int64> currency_map = 1;
}

message ConnSvrInfo {
    uint32 bus_id     = 1;
    string client_pos = 2;
    uint32 client_ip  = 3;
}

// 玩家头像框需要的信息
message PbIconDesc {
    uint64 uid       = 1;
    string name      = 2;
    string icon_url  = 3;
    int32  frame     = 4;
    int32  level     = 5;
    int32  vip_level = 6;

    int32 last_online_time = 30;
    bool  is_online        = 31;
}