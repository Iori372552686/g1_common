syntax = "proto3";

package game.mainsvr.v1;

import "goone/options/v1/options.proto";
import "core/client.proto";

option go_package = "github.com/Iori372552686/GoOne/api/gen/game/mainsvr/v1;mainsvrv1";

// MainC2SService exposes mainsvr client-facing commands via SSPacket.
// Source-of-truth lives in g1_common; GoOne generates wrappers into api/gen.
service MainC2SService {
  option (goone.options.v1.ssrpc_service) = {
    timeout_ms: 5000
  };

  rpc Login(g1.protocol.LoginReq) returns (g1.protocol.LoginRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_LOGIN_REQ"
      ws: true
      comment: "mainsvr login"
    };
  }

  rpc Logout(g1.protocol.LogoutReq) returns (g1.protocol.LogoutRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_LOGOUT_REQ"
      comment: "mainsvr logout (rsp optional, see req.ByServer)"
    };
  }

  rpc HeartBeat(g1.protocol.HeartBeatReq) returns (g1.protocol.HeartBeatRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_HEARTBEAT_REQ"
      comment: "mainsvr heartbeat"
    };
  }

  rpc ChangeName(g1.protocol.ChangeNameReq) returns (g1.protocol.ChangeNameRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_CHANGE_NAME_REQ"
      comment: "mainsvr change name"
    };
  }

  rpc ChangeIcon(g1.protocol.ChangeIconReq) returns (g1.protocol.ChangeIconRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_CHANGE_ICON_REQ"
      comment: "mainsvr change icon"
    };
  }

  rpc GmGetRole(g1.protocol.GMGetRoleReq) returns (g1.protocol.GMGetRoleRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_GM_GET_ROLE_REQ"
      comment: "gm get role"
    };
  }

  rpc GmSetRole(g1.protocol.GMSetRoleReq) returns (g1.protocol.GMSetRoleRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_GM_SET_ROLE_REQ"
      comment: "gm set role"
    };
  }

  rpc GmAddItem(g1.protocol.GMAddItemReq) returns (g1.protocol.GMAddItemRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_GM_ADD_ITEM_REQ"
      comment: "gm add item"
    };
  }

  // ===== 背包/道具系统=====

  rpc UseItem(g1.protocol.UseItemReq) returns (g1.protocol.UseItemRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_ITEM_USE_REQ"
      comment: "use item"
    };
  }

  rpc SellItem(g1.protocol.SellItemReq) returns (g1.protocol.SellItemRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_ITEM_SELL_REQ"
      comment: "sell item"
    };
  }

  rpc DecomposeItem(g1.protocol.DecomposeItemReq) returns (g1.protocol.DecomposeItemRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_ITEM_DECOMPOSE_REQ"
      comment: "decompose item"
    };
  }

  rpc QueryBackpack(g1.protocol.QueryBackpackReq) returns (g1.protocol.QueryBackpackRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_BACKPACK_QUERY_REQ"
      comment: "query backpack with paging"
    };
  }

  rpc BatchAddItem(g1.protocol.BatchAddItemReq) returns (g1.protocol.BatchAddItemRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_ITEM_BATCH_ADD_REQ"
      comment: "batch add item (gm/test)"
    };
  }

  rpc MallBuyPackage(g1.protocol.MallBuyPackageReq) returns (g1.protocol.MallBuyPackageRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MAIN_MALL_BUY_PACKAGE_REQ"
      comment: "mall buy package"
    };
  }
}
