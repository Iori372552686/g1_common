syntax = "proto3";

package game.mysqlsvr.v1;

import "goone/options/v1/options.proto";
import "service/mysqlsvr.proto";

option go_package = "github.com/Iori372552686/GoOne/api/gen/game/mysqlsvr/v1;mysqlsvrv1";

// MysqlService exposes mysqlsvr internal commands via SSPacket.
// Source-of-truth lives in g1_common; GoOne generates wrappers into api/gen.
service MysqlService {
  option (goone.options.v1.ssrpc_service) = {
    timeout_ms: 5000
  };

  rpc UpdateRoleInfo(g1.protocol.MysqlInnerUpdateRoleInfoReq) returns (g1.protocol.MysqlInnerUpdateRoleInfoRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MYSQL_INNER_UPDATE_ROLE_INFO_REQ"
      comment: "mysql update role info"
    };
  }

  rpc SearchRole(g1.protocol.MysqlInnerSearchRoleReq) returns (g1.protocol.MysqlInnerSearchRoleRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MYSQL_INNER_SEARCH_ROLE_REQ"
      comment: "mysql search role"
    };
  }

  // L3 全量快照写回：运行期经 IgnoreRsp 异步投递，停机路径同步等 ack。
  rpc SaveRoleData(g1.protocol.MysqlInnerSaveRoleDataReq) returns (g1.protocol.MysqlInnerSaveRoleDataRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MYSQL_INNER_SAVE_ROLE_DATA_REQ"
      comment: "mysql save role data snapshot"
    };
  }

  // L2 miss 回源读（冷登录）。miss 时 rsp.data 为空、ret 为 OK。
  rpc LoadRoleData(g1.protocol.MysqlInnerLoadRoleDataReq) returns (g1.protocol.MysqlInnerLoadRoleDataRsp) {
    option (goone.options.v1.ssrpc) = {
      cmd_name: "CMD_MYSQL_INNER_LOAD_ROLE_DATA_REQ"
      comment: "mysql load role data snapshot"
    };
  }

}
